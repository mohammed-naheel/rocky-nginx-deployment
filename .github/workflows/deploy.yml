name: Rocky Linux Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify HTML file
        run: |
          test -f index.html
          echo "index.html found"

      - name: Deploy to Nginx
        run: |
          cp index.html /var/www/myapp/index.html
          echo "Deployment completed"

      - name: Verify deployed website
        run: |
          curl -f -H "Host: myapp.local" http://localhost/
          echo "Nginx verification successful"
