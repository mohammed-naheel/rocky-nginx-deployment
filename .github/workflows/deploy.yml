name: Rocky Linux Deployment

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "Project files:"
          ls -la

      - name: Test HTML file
        run: |
          test -f index.html
          echo "index.html exists"