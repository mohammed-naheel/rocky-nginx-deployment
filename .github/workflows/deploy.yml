name: Versioned Nexus Deployment with Auto Rollback

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create release version
        run: |
          echo "RELEASE_VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "Preparing release: ${GITHUB_SHA::7}"

      - name: Upload release to Nexus
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail

          curl --fail --show-error --silent \
            --user "$NEXUS_USER:$NEXUS_PASSWORD" \
            --upload-file index.html \
            "$NEXUS_URL/repository/nginx-releases/releases/$RELEASE_VERSION/index.html"

          echo "Release uploaded to Nexus"

      - name: Download and verify release
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail

          curl --fail --show-error --silent \
            --user "$NEXUS_USER:$NEXUS_PASSWORD" \
            --output downloaded-index.html \
            "$NEXUS_URL/repository/nginx-releases/releases/$RELEASE_VERSION/index.html"

          cmp index.html downloaded-index.html
          echo "Nexus artifact verified"

      - name: Deploy and automatically rollback on failure
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail

          TARGET="/var/www/myapp/index.html"
          BACKUP="/var/www/myapp/index.html.before-${RELEASE_VERSION}-$(date +%Y%m%d_%H%M%S)"
          TEMP="$(mktemp /var/www/myapp/.index.html.XXXXXX)"
          VERIFY="$(mktemp)"

          trap 'rm -f "$TEMP" "$VERIFY"' EXIT

          if [ ! -f "$TARGET" ]; then
            echo "ERROR: Current website file is missing; cannot create a backup."
            exit 1
          fi

          cp "$TARGET" "$BACKUP"
          echo "Backup created: $BACKUP"

          install -m 0644 downloaded-index.html "$TEMP"
          mv -f "$TEMP" "$TARGET"

          if ! curl --fail --show-error --silent \
            -H "Host: myapp.local" \
            http://localhost/ \
            --output "$VERIFY"; then

            echo "Deployment verification failed. Restoring previous release."
            cp "$BACKUP" "$TARGET"
            exit 1
          fi

          if ! cmp -s downloaded-index.html "$VERIFY"; then
            echo "Content verification failed. Restoring previous release."
            cp "$BACKUP" "$TARGET"
            exit 1
          fi

          echo "Deployment successful: $RELEASE_VERSION"
          echo "Previous version backup: $BACKUP"