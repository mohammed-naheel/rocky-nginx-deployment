name: Versioned Nexus Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create release version
        run: |
          echo "RELEASE_VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "Preparing release: ${GITHUB_SHA::7}"

      - name: Upload versioned release to Nexus
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail

          curl --fail --show-error --silent \
            --user "$NEXUS_USER:$NEXUS_PASSWORD" \
            --upload-file index.html \
            "$NEXUS_URL/repository/nginx-releases/releases/$RELEASE_VERSION/index.html"

          echo "Release uploaded: $RELEASE_VERSION"

      - name: Download release from Nexus
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail

          curl --fail --show-error --silent \
            --user "$NEXUS_USER:$NEXUS_PASSWORD" \
            --output downloaded-index.html \
            "$NEXUS_URL/repository/nginx-releases/releases/$RELEASE_VERSION/index.html"

          cmp index.html downloaded-index.html
          echo "Nexus artifact downloaded and verified"

      - name: Deploy downloaded release to Nginx
        run: |
          set -euo pipefail
          cp downloaded-index.html /var/www/myapp/index.html
          echo "Deployed release: $RELEASE_VERSION"

      - name: Verify Nginx deployment
        run: |
          set -euo pipefail
          curl --fail --show-error \
            -H "Host: myapp.local" \
            http://localhost/
          echo "Nginx verification successful"