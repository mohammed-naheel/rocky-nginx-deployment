name: Rocky Linux Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show runner information
        run: |
          echo "Hostname:"
          hostname
          echo "User:"
          whoami
          echo "Working directory:"
          pwd

      - name: Test HTML file
        run: |
          test -f index.html
          echo "index.html exists"
